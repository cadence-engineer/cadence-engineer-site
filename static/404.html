<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<link rel="icon" href="/favicon.png" type="image/png" />
		<title>Page not found · Cadence Engineer</title>
		<style>
			:root {
				color: #000;
				background: #fff;
				font-family:
					Satoshi, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
					sans-serif;
				font-synthesis: none;
			}

			* {
				box-sizing: border-box;
			}

			body {
				display: grid;
				grid-template-rows: auto 1fr;
				min-width: 320px;
				min-height: 100vh;
				margin: 0;
			}

			header {
				display: flex;
				width: 100%;
				max-width: 75rem;
				min-height: 4rem;
				align-items: center;
				margin-inline: auto;
				padding-inline: 1rem;
			}

			header a {
				display: flex;
				align-items: center;
			}

			header img {
				display: block;
				width: 2rem;
				height: auto;
			}

			main {
				display: grid;
				width: 100%;
				max-width: 75rem;
				align-content: start;
				margin-inline: auto;
				padding: 3.5rem 1rem;
				gap: 1rem;
			}

			h1,
			p {
				margin: 0;
			}

			h1 {
				font-size: 2rem;
				font-weight: 900;
				line-height: 1.2;
			}

			p,
			a {
				font-size: 1rem;
				font-weight: 500;
				line-height: 1.4;
			}

			a {
				color: inherit;
			}

			a:focus-visible {
				outline: 2px solid #ef406c;
				outline-offset: 2px;
			}
		</style>
	</head>
	<body>
		<header>
			<a href="/" aria-label="Cadence Engineer home">
				<img src="/logo/whorl_no_whitespace.svg" alt="" />
			</a>
		</header>
		<main>
			<h1>404 Not Found</h1>
			<p>This page couldn't be found. <a href="/">Go back to the homepage.</a></p>
		</main>
	</body>
</html>
