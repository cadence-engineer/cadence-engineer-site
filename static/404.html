<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<title>Page not found · Cadence Engineer</title>
		<style>
			:root {
				color: #000;
				background: #fff;
				font-family: Satoshi, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
				font-synthesis: none;
			}

			* { box-sizing: border-box; }

			body {
				display: grid;
				min-width: 320px;
				min-height: 100vh;
				margin: 0;
				place-items: center;
				padding: 1.5rem;
			}

			main { width: min(100%, 42rem); }

			.status {
				margin: 0 0 1rem;
				color: #ef406c;
				font-size: 0.875rem;
				font-weight: 900;
				letter-spacing: 0.08em;
			}

			h1 {
				max-width: 11ch;
				margin: 0;
				font-size: clamp(3rem, 12vw, 7rem);
				font-weight: 900;
				letter-spacing: -0.07em;
				line-height: 0.9;
			}

			p:not(.status) {
				max-width: 34rem;
				margin: 1.5rem 0 0;
				font-size: clamp(1rem, 2vw, 1.25rem);
				font-weight: 500;
				line-height: 1.5;
			}

			a {
				display: inline-flex;
				align-items: center;
				height: 2.75rem;
				margin-top: 2rem;
				border-radius: 1.375rem;
				padding-inline: 1.25rem;
				background: #ef406c;
				color: #fff;
				font-weight: 900;
				text-decoration: none;
			}

			a:focus-visible { outline: 2px solid #000; outline-offset: 3px; }
		</style>
	</head>
	<body>
		<main>
			<p class="status">404</p>
			<h1>This page does not exist.</h1>
			<p>The address may be incorrect, or the page may have moved.</p>
			<a href="/">Back to home</a>
		</main>
	</body>
</html>
